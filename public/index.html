<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vymazani nabytku</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Vymazani nabytku z fotky">
        <div class="topbar">
          <div>
            <h1>Vymazani nabytku</h1>
            <p id="statusText">Nahrajte fotku mistnosti z telefonu nebo pocitace.</p>
          </div>
          <div class="upload-actions">
            <label class="file-button">
              <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif">
              <span>Vybrat fotku</span>
            </label>
            <label class="file-button">
              <input id="cameraInput" type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif" capture="environment">
              <span>Vyfotit</span>
            </label>
          </div>
        </div>

        <div class="actions">
          <button id="removeButton" class="primary" type="button" disabled>Vymazat nabytek</button>
          <button id="shareButton" type="button" disabled>Sdilet / ulozit</button>
          <a id="downloadButton" class="download disabled" href="#" download>Stahnout vysledek</a>
        </div>

        <section class="edit-options" aria-label="Rozsah upravy">
          <div class="option-header">
            <h2>Ponechat</h2>
            <p>Bez vyberu se odstrani vse. Kuchynska linka zustane vzdy.</p>
          </div>
          <fieldset class="category-panel">
            <legend>Jen zaskrtnute kusy zustanou</legend>
            <label><input type="checkbox" name="keepCategory" value="bed"> Postel</label>
            <label><input type="checkbox" name="keepCategory" value="seating"> Gauc a kresla</label>
            <label><input type="checkbox" name="keepCategory" value="table"> Stul</label>
            <label><input type="checkbox" name="keepCategory" value="chairs"> Zidle</label>
            <label><input type="checkbox" name="keepCategory" value="storage"> Skrine a komody</label>
            <label><input type="checkbox" name="keepCategory" value="tv_unit"> TV a stolek</label>
            <label><input type="checkbox" name="keepCategory" value="shelves"> Regaly a police</label>
            <label><input type="checkbox" name="keepCategory" value="rug"> Koberec</label>
          </fieldset>
        </section>

        <div class="preview-grid">
          <figure class="preview">
            <figcaption>Puvodni fotka</figcaption>
            <div class="image-frame empty" id="originalFrame">
              <img id="originalImage" alt="Puvodni fotka mistnosti">
              <span>Neni nahrana fotka</span>
            </div>
          </figure>

          <figure class="preview">
            <figcaption>Upravena fotka</figcaption>
            <div class="image-frame empty" id="resultFrame">
              <img id="resultImage" alt="Fotka mistnosti bez nabytku">
              <div id="spinner" class="spinner" hidden></div>
              <span id="resultPlaceholder">Vysledek se zobrazi tady</span>
            </div>
          </figure>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
